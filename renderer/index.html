<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>上班鼓励器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }

  .card {
    width: 100%; height: 100%;
    background: rgba(18, 20, 26, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    padding: 12px 16px 10px;
    display: flex; flex-direction: column; justify-content: space-between;
    cursor: move;
    -webkit-app-region: drag;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  }

  .row { display: flex; align-items: baseline; justify-content: space-between; }

  .label { color: #8b8f9a; font-size: 12px; letter-spacing: 1px; }
  .gear {
    -webkit-app-region: no-drag; cursor: pointer; color: #8b8f9a; font-size: 14px;
    padding: 2px 6px; border-radius: 6px; transition: background .15s;
  }
  .gear:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

  .money-row { margin-top: 2px; }
  .money { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .theme-red .money { color: #ff5b5b; text-shadow: 0 0 18px rgba(255, 91, 91, .35); }
  .theme-green .money { color: #3fd97f; text-shadow: 0 0 18px rgba(63, 217, 127, .35); }
  .persec { color: #8b8f9a; font-size: 11px; font-variant-numeric: tabular-nums; }

  .bar-wrap { margin-top: 8px; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
  .bar-inner { height: 100%; width: 0%; border-radius: 3px; transition: width .5s linear; }
  .theme-red .bar-inner { background: linear-gradient(90deg, #ff5b5b, #ff9f43); }
  .theme-green .bar-inner { background: linear-gradient(90deg, #3fd97f, #a8e063); }

  .stats { margin-top: 7px; color: #c8ccd4; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .stats b { color: #fff; font-weight: 600; }
  .status { font-size: 11.5px; }
  .status.working { color: #ffb020; }
  .status.after { color: #3fd97f; }
  .status.before { color: #6ea8ff; }
  .status.rest { color: #8b8f9a; }
</style>
</head>
<body class="theme-red">
  <div class="card" id="card">
    <div class="row">
      <span class="label" id="title">💰 今日已赚</span>
      <span class="gear" id="gear" title="设置">⚙</span>
    </div>
    <div class="row money-row">
      <span class="money" id="earned">¥0.00</span>
      <span class="persec" id="persec">+¥0.0000/秒</span>
    </div>
    <div class="bar-wrap"><div class="bar"><div class="bar-inner" id="bar"></div></div></div>
    <div class="row stats">
      <span id="left"><b id="offwork">--:--:--</b> 下班</span>
      <span id="mid">发薪 <b id="payday">-</b> 天</span>
      <span class="status working" id="status">搬砖中</span>
    </div>
  </div>

  <script src="core.js"></script>
  <script>
    let settings = null;
    const C = window.EncouragerCore;
    const $ = (id) => document.getElementById(id);

    function applyTheme() {
      document.body.className = settings.theme === 'green' ? 'theme-green' : 'theme-red';
    }

    function tick() {
      if (!settings) return;
      const now = new Date();
      const r = C.earnedToday(settings, now);
      $('earned').textContent = C.fmtMoney(r.earned);
      $('persec').textContent = '+' + C.fmtMoney(C.perSecondSalary(settings), 4) + '/秒';
      $('bar').style.width = (r.progress * 100).toFixed(1) + '%';

      const titleMap = { working: '💰 今日已赚', before: '🌅 还没开工', after: '🎉 今日战果', rest: '🛌 今日休息' };
      $('title').textContent = titleMap[r.status];

      if (r.status === 'working') {
        $('offwork').textContent = C.fmtDuration(r.remainSec);
        $('status').textContent = '搬砖中 ' + (r.progress * 100).toFixed(1) + '%';
        $('status').className = 'status working';
      } else if (r.status === 'before') {
        $('offwork').textContent = C.fmtDuration(r.remainSec + (C.parseHM(settings.workStart) - (now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds())));
        $('status').textContent = '等待开工';
        $('status').className = 'status before';
      } else if (r.status === 'after') {
        $('offwork').textContent = '已下班';
        $('status').textContent = '收工啦';
        $('status').className = 'status after';
      } else {
        $('offwork').textContent = '--:--:--';
        $('status').textContent = '休息日';
        $('status').className = 'status rest';
      }
      $('payday').textContent = C.daysToPayday(settings, now);
    }

    async function init() {
      settings = await window.encourager.getSettings();
      applyTheme();
      tick();
      setInterval(tick, 100); // 数字滚动更顺滑
      window.encourager.onSettingsChanged((s) => { settings = s; applyTheme(); tick(); });
      $('gear').addEventListener('click', () => window.encourager.openSettings());
    }
    init();
  </script>
</body>
</html>
