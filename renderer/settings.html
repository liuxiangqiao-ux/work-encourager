<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>上班鼓励器 - 设置</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #1b1d24; color: #e6e8ee; padding: 22px 26px; font-size: 14px;
  }
  h1 { font-size: 17px; margin-bottom: 18px; }
  h1 span { color: #ff5b5b; }
  .field { margin-bottom: 16px; }
  .field label { display: block; color: #9aa0ac; font-size: 12.5px; margin-bottom: 6px; }
  input[type="number"], input[type="time"] {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #343845;
    background: #252832; color: #fff; font-size: 14px; outline: none;
  }
  input:focus { border-color: #ff5b5b; }
  .days { display: flex; gap: 6px; }
  .day {
    flex: 1; text-align: center; padding: 7px 0; border-radius: 8px; cursor: pointer;
    background: #252832; border: 1px solid #343845; color: #9aa0ac; font-size: 12.5px;
  }
  .day.on { background: rgba(255, 91, 91, .18); border-color: #ff5b5b; color: #ff5b5b; }
  .themes { display: flex; gap: 10px; }
  .theme-opt {
    flex: 1; padding: 9px 0; text-align: center; border-radius: 8px; cursor: pointer;
    border: 1px solid #343845; background: #252832; font-size: 13px;
  }
  .theme-opt.on-red { border-color: #ff5b5b; color: #ff5b5b; background: rgba(255, 91, 91, .12); }
  .theme-opt.on-green { border-color: #3fd97f; color: #3fd97f; background: rgba(63, 217, 127, .12); }
  .switch-row { display: flex; align-items: center; justify-content: space-between; }
  .switch-row label { margin: 0; color: #e6e8ee; font-size: 13.5px; }
  input[type="range"] { width: 100%; accent-color: #ff5b5b; }
  .btn {
    width: 100%; padding: 11px 0; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(90deg, #ff5b5b, #ff9f43); color: #fff;
    font-size: 15px; font-weight: 600; margin-top: 6px;
  }
  .btn:active { transform: scale(.98); }
  .hint { color: #6b707c; font-size: 11.5px; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
  <h1>⚙ 上班鼓励器 <span>设置</span></h1>

  <div class="field">
    <label>月薪（元）</label>
    <input type="number" id="salary" min="0" step="100">
  </div>

  <div class="field" style="display:flex;gap:12px;">
    <div style="flex:1">
      <label>上班时间</label>
      <input type="time" id="workStart">
    </div>
    <div style="flex:1">
      <label>下班时间</label>
      <input type="time" id="workEnd">
    </div>
  </div>

  <div class="field">
    <label>工作日</label>
    <div class="days" id="days">
      <div class="day" data-d="1">一</div><div class="day" data-d="2">二</div>
      <div class="day" data-d="3">三</div><div class="day" data-d="4">四</div>
      <div class="day" data-d="5">五</div><div class="day" data-d="6">六</div>
      <div class="day" data-d="0">日</div>
    </div>
  </div>

  <div class="field">
    <label>每月发薪日（1-28）</label>
    <input type="number" id="payDay" min="1" max="28">
  </div>

  <div class="field">
    <label>数字颜色</label>
    <div class="themes">
      <div class="theme-opt" data-t="red" id="themeRed">📈 大涨红</div>
      <div class="theme-opt" data-t="green" id="themeGreen">💹 护眼绿</div>
    </div>
  </div>

  <div class="field switch-row">
    <label>窗口置顶</label>
    <input type="checkbox" id="alwaysOnTop" style="width:18px;height:18px;accent-color:#ff5b5b;">
  </div>

  <div class="field">
    <label>窗口透明度 <span id="opacityVal"></span></label>
    <input type="range" id="opacity" min="40" max="100">
  </div>

  <button class="btn" id="save">保存并应用</button>
  <div class="hint">日薪 = 月薪 ÷ 21.75（法定月计薪天数），仅在工作时段内累计</div>

  <script src="core.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let settings = null;

    function render() {
      $('salary').value = settings.salary;
      $('workStart').value = settings.workStart;
      $('workEnd').value = settings.workEnd;
      $('payDay').value = settings.payDay;
      $('alwaysOnTop').checked = settings.alwaysOnTop;
      $('opacity').value = Math.round(settings.opacity * 100);
      $('opacityVal').textContent = Math.round(settings.opacity * 100) + '%';
      document.querySelectorAll('.day').forEach(el => {
        el.classList.toggle('on', settings.workDays.includes(Number(el.dataset.d)));
      });
      $('themeRed').className = 'theme-opt' + (settings.theme === 'red' ? ' on-red' : '');
      $('themeGreen').className = 'theme-opt' + (settings.theme === 'green' ? ' on-green' : '');
    }

    async function init() {
      settings = await window.encourager.getSettings();
      render();

      document.querySelectorAll('.day').forEach(el => {
        el.addEventListener('click', () => {
          const d = Number(el.dataset.d);
          const i = settings.workDays.indexOf(d);
          if (i >= 0) settings.workDays.splice(i, 1); else settings.workDays.push(d);
          if (settings.workDays.length === 0) settings.workDays = [d];
          render();
        });
      });
      $('themeRed').addEventListener('click', () => { settings.theme = 'red'; render(); });
      $('themeGreen').addEventListener('click', () => { settings.theme = 'green'; render(); });
      $('opacity').addEventListener('input', () => {
        $('opacityVal').textContent = $('opacity').value + '%';
      });

      $('save').addEventListener('click', async () => {
        const next = {
          salary: Math.max(0, Number($('salary').value) || 0),
          workStart: $('workStart').value || '09:00',
          workEnd: $('workEnd').value || '18:00',
          payDay: Math.min(28, Math.max(1, Number($('payDay').value) || 10)),
          alwaysOnTop: $('alwaysOnTop').checked,
          opacity: Math.min(1, Math.max(0.4, Number($('opacity').value) / 100)),
          workDays: [...settings.workDays].sort(),
          theme: settings.theme
        };
        settings = await window.encourager.saveSettings(next);
        $('save').textContent = '✓ 已保存';
        setTimeout(() => { $('save').textContent = '保存并应用'; }, 1200);
      });
    }
    init();
  </script>
</body>
</html>
